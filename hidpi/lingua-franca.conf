<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Generic name aliasing -->
    <alias>
        <family>serif</family>
        <accept>
            <family>Lingua Franca</family>
        </accept>
    </alias>

    <!-- Generic name assignment -->
    <alias>
        <family>Lingua Franca</family>
        <default>
            <family>serif</family>
        </default>
    </alias>

    <!-- Font substitution rules -->
    <alias binding="same">
        <family>Adobe Utopia</family>
        <prefer>
            <family>Lingua Franca</family>
        </prefer>
    </alias>

    <alias binding="same">
        <family>Constantia</family>
        <prefer>
            <family>Lingua Franca</family>
        </prefer>
    </alias>

    <alias binding="same">
        <family>Heuristica</family>
        <prefer>
            <family>Lingua Franca</family>
        </prefer>
    </alias>

    <alias binding="same">
        <family>Utopia</family>
        <prefer>
            <family>Lingua Franca</family>
        </prefer>
    </alias>

    <!-- Typographic features -->
    <match target="font">
        <test name="family" compare="eq" ignore-blanks="true">
            <string>Lingua Franca</string>
        </test>
        <edit name="fontfeatures" mode="append">
            <!-- Old-style figures for Constantia alias. -->
            <string>onum on</string>
        </edit>
    </match>
</fontconfig>
