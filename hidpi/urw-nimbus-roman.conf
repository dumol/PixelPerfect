<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Generic name aliasing -->
    <alias>
        <family>serif</family>
        <accept>
            <family>Nimbus Roman</family>
        </accept>
    </alias>

    <!-- Generic name assignment -->
    <alias>
        <family>Nimbus Roman</family>
        <default>
            <family>serif</family>
        </default>
    </alias>

    <!-- Original PostScript base font mappings -->
    <alias binding="same">
        <family>Nimbus Roman</family>
        <default>
            <family>Times</family>
        </default>
    </alias>

    <alias binding="same">
        <family>Nimbus Roman No9 L</family>
        <default>
            <family>Times</family>
        </default>
    </alias>

    <!-- Font substitution rules -->
    <alias binding="same">
        <family>FreeSerif</family>
        <accept>
            <family>Nimbus Roman</family>
            <family>TeX Gyre Termes</family>
            <family>PT Astra Serif</family>
            <family>Tinos</family>
        </accept>
    </alias>

    <alias binding="same">
        <family>Nimbus Roman L</family>
        <accept>
            <family>Nimbus Roman</family>
            <family>TeX Gyre Termes</family>
            <family>PT Astra Serif</family>
            <family>Tinos</family>
        </accept>
    </alias>

    <alias binding="same">
        <family>Nimbus Roman No9 L</family>
        <accept>
            <family>Nimbus Roman</family>
            <family>TeX Gyre Termes</family>
            <family>PT Astra Serif</family>
            <family>Tinos</family>
        </accept>
    </alias>

    <alias binding="same">
        <family>Roman</family>
        <accept>
            <family>Nimbus Roman</family>
            <family>TeX Gyre Termes</family>
            <family>PT Astra Serif</family>
            <family>Tinos</family>
        </accept>
    </alias>

    <alias binding="same">
        <family>Times</family>
        <accept>
            <family>Nimbus Roman</family>
            <family>TeX Gyre Termes</family>
            <family>PT Astra Serif</family>
            <family>Tinos</family>
        </accept>
    </alias>
</fontconfig>
