<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Generic name aliasing -->
    <alias>
        <family>fantasy</family>
        <accept>
            <family>Z003</family>
        </accept>
    </alias>

    <!-- Generic name assignment -->
    <alias>
        <family>Z003</family>
        <default>
            <family>fantasy</family>
        </default>
    </alias>

    <!-- Original PostScript base font mappings -->
    <alias binding="same">
        <family>Z003</family>
        <default>
            <family>ITC Zapf Chancery</family>
        </default>
    </alias>

    <alias binding="same">
        <family>Chancery URW</family>
        <default>
            <family>ITC Zapf Chancery</family>
        </default>
    </alias>

    <alias binding="same">
        <family>URW Chancery L</family>
        <default>
            <family>ITC Zapf Chancery</family>
        </default>
    </alias>

    <!-- Font substitution rules -->
    <alias binding="same">
        <family>Chancery URW</family>
        <accept>
            <family>Z003</family>
            <family>TeX Gyre Chorus</family>
        </accept>
    </alias>

    <alias binding="same">
        <family>ITC Zapf Chancery</family>
        <accept>
            <family>Z003</family>
            <family>TeX Gyre Chorus</family>
        </accept>
    </alias>

    <alias binding="same">
        <family>Zapf Chancery</family>
        <accept>
            <family>Z003</family>
            <family>TeX Gyre Chorus</family>
        </accept>
    </alias>

    <alias binding="same">
        <family>URW Chancery L</family>
        <accept>
            <family>Z003</family>
            <family>TeX Gyre Chorus</family>
        </accept>
    </alias>
</fontconfig>
