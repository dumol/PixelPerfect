<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Font substitution rules -->
    <alias binding="same">
        <family>Futura</family>
        <accept>
            <family>Jost*</family>
        </accept>
    </alias>

    <alias binding="same">
        <family>Futura BT</family>
        <accept>
            <family>Jost*</family>
        </accept>
    </alias>

    <alias binding="same">
        <family>Futura Now</family>
        <accept>
            <family>Jost*</family>
        </accept>
    </alias>

    <alias binding="same">
        <family>Futura PT</family>
        <accept>
            <family>Jost*</family>
        </accept>
    </alias>

    <alias binding="same">
        <family>Neufville Futura</family>
        <accept>
            <family>Jost*</family>
        </accept>
    </alias>
</fontconfig>
