<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>


    <description>Settings and aliases for low DPI screens</description> 

    <!-- Force a DPI of 96, even on devices with a lower DPI. Manual TrueType
         hinting for small sizes is usually done at this standard DPI value. -->
    <match target="pattern" >
        <edit mode="assign" name="dpi" >
            <double>96</double>
        </edit>
    </match>

    <!-- Some fonts embed bitmaps for certain sizes. They are desirable on loDPI
         screens, but enabling them here can break fonts, e.g. Anonymous Pro.
         One solution is to set this as 'false', then disable AA for those sizes
         in pixelperfect.conf, but Firefox/Chrome break Wine's Tahoma. -->
    <match target="font" >
        <edit name="embeddedbitmap" mode="assign">
            <bool>true</bool>
        </edit>
    </match>

    <!-- Aliases for the generic W3C font families.
         Should be close to the metrics of the main OS'es generics:
           * Times / Helvetica / Courier on macOS,
           * Times New Roman / Arial / Courier New on Windows.
         However, Fontconfig aliases much bigger fonts by default for serif
         and sans-serif, therefore user expectations may be quite different! -->
    <alias binding="strong">
        <family>serif</family>
        <prefer>
            <!-- This is also the default web font when nothing is specified.-->
            <family>Liberation Serif</family>
            <family>PT Serif</family>
            <family>DejaVu Serif</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>sans-serif</family>
        <prefer>
            <!-- Java apps still use this as default UI font, so it should be
                 close metrically to whatever is used for system-ui.
                 A conflicting requirement is this should match Helvetica
                 metrics, as many web developers only test on macOS. -->
            <family>Liberation Sans</family>
            <family>PT Sans</family>
            <family>Ubuntu</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>monospace</family>
        <prefer>
            <family>Liberation Mono</family>
            <family>PT Mono</family>
            <family>Ubuntu Mono</family>
        </prefer>
    </alias>
    <!-- Chrome picks Cursive and Fantasy aliases by itself. FIXME#5 
         Cursive and Fantasy aliases are ignored by WebKitGTK. FIXME#6 -->
    <alias binding="strong">
        <family>cursive</family>
        <prefer>
            <family>Kaushan Script</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>fantasy</family>
        <prefer>
            <family>Lobster Two</family>
        </prefer>
    </alias>

    <!-- Aliases for the CSS 4 font families.
         These are also the recommended typefaces for the user interface texts.
         Sizes to use for interface/document/monospace UI texts: 11/10/10 pt.
         Increase text sizes in accordance with the zoom level of your browser,
         e.g. 13/12/12 pt for a default browser zoom of 120% (with no scaling).
         Alternatively, use the default UI text sizes and text scaling, e.g.:
            gsettings set org.gnome.desktop.interface text-scaling-factor "1.2"
         for a DPI of ~115 and a default browser zoom of 120% (with no scaling).
         If you need bigger sizes or scaling, switch to the hidpi setup in
         fonts.conf and set the rgba option as appropiate for your displays. -->
    <alias binding="strong">
        <family>system-ui</family>
        <prefer>
            <family>PT Sans</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>ui-monospace</family>
        <prefer>
            <family>Luculent</family>
            <family>Liberation Mono</family>
            <family>PT Mono</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>ui-sans-serif</family>
        <prefer>
            <family>Liberation Sans</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>ui-serif</family>
        <prefer>
            <family>PT Serif</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>ui-rounded</family>
        <prefer>
            <family>Varela Round</family>
        </prefer>
    </alias>

    <!-- Aliases used to target the macOS UI font. Hijacked for our UI font.
         Sites assume metrics close to those of the dominant OS'es UI fonts. -->
    <alias binding="strong">
        <family>-apple-system</family>
        <prefer>
            <family>PT Sans</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>-webkit-system-font</family>
        <prefer>
            <family>PT Sans</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>BlinkMacSystemFont</family>
        <prefer>
            <family>PT Sans</family>
        </prefer>
    </alias>
    

        <!-- Metrically-identical fonts. -->

    <!-- Andale Mono, Source Code Pro, Droid Sans Mono, Noto Sans Mono.
         Andale Mono used on https://theintercept.com (fallback).
         Source Code Pro used on https://www.vice.com. -->
    <include prefix="xdg">fontconfig/lodpi/noto-mono.conf</include>

    <!-- Bitter, Bitter Pro. Used on: https://arstechnica.com.
         TTF version from the googlefontdirectory repo for low DPI screens. -->
    <include prefix="xdg">fontconfig/lodpi/bitter.conf</include>
 
    <!-- Courier, Courier New/Std. Not the greatest match, but Wine's Courier
         is far from good enough. Liberation Mono is even less of a match. -->
    <include prefix="xdg">fontconfig/lodpi/pt-mono.conf</include>

    <!-- Helvetica, MS Sans Serif, Arimo, and other missing aliases.
         Arial used on many sites, e.g. https://www.google.com.
         Helvetica used on many sites, e.g. https://www.facebook.com.
         Helvetica Neue used on many sites, e.g. https://www.yahoo.com.
         Arimo used on https://www.anandtech.com. -->
    <include prefix="xdg">fontconfig/lodpi/liberation-sans.conf</include>

    <!-- Liberation Mono, Menlo, Lucida Console/Sans Typewriter/Grande Mono. -->
    <include prefix="xdg">fontconfig/lodpi/liberation-mono.conf</include>

    <!-- Times New Roman, Times, MS Serif, Tinos, and other missing aliases.
         Times New Roman used on https://www.nlm.nih.gov/,
         https://www.latimes.com (fallback).
         Times used on https://www.thetimes.co.uk. -->
    <include prefix="xdg">fontconfig/lodpi/liberation-serif.conf</include>

        <!-- End of metrically-identical fonts -->


        <!-- From here on, matches are not that great,
             but it's better to differentiate these typefaces. -->

    <!-- Arial Narrow and friends (Liberation Narrow is poorly hinted.)
         Other (even less similar) options: Cabin Condensed, Ubuntu Condensed.
         Arial Narrow used on: https://www.nbcnews.com (fallback),
         https://time.com (fallback), https://apnews.com (fallback). -->
    <include prefix="xdg">fontconfig/lodpi/pt-sans-narrow.conf</include>

    <!-- Georgia. Similar metrics, with a slightly higher x-height. A much
         better alias than Liberation/DejaVu Serif. No old-style figures though.
         Georgia used on many sites, e.g. https://www.washingtonpost.com. -->
    <include prefix="xdg">fontconfig/lodpi/pt-serif.conf</include>

    <!-- Inconsolata, Consolas. The former is inspired by the latter,
         unfortunately metrics are a bit different. Version from
         googlefontdirectory repo to be used on low DPI screens.
         Consolas used on https://stackoverflow.com (fallback), etc. -->
    <include prefix="xdg">fontconfig/lodpi/inconsolata.conf</include>

    <!-- Monotype Corsiva, Corsiva, Lucida Calligraphy. -->
    <include prefix="xdg">fontconfig/lodpi/felipa.conf</include>

    <!-- Proxima Nova. Most successful commercial font on the web. There's no
         open-source font with perfect hinting to replace it. To avoid falling
         back to default sans-serif, let's give Cabin a bit more use...
         Proxima Nova used on: https://www.cnbc.com, https://duckduckgo.com.
         Proxima Nova Cond used on https://gizmodo.com. -->
    <include prefix="xdg">fontconfig/lodpi/cabin.conf</include>

    <!-- Segoe UI, Segoe, Geneva, Cantarell.
         Segoe UI used on https://www.microsoft.com, https://msn.com, etc.
         Segoe used on https://outlook.live.com.
         Geneva used on https://news.ycombinator.com/ (fallback). -->
    <include prefix="xdg">fontconfig/lodpi/pt-sans.conf</include>

    <!-- Verdana, DejaVu Sans, Bitstream Vera Sans. Unfortunately, no italics.
         Verdana used on: https://www.imdb.com, https://news.ycombinator.com.-->
    <include prefix="xdg">fontconfig/lodpi/pt-sans-caption.conf</include>


        <!-- Extra rules -->

    <!-- Recommended font for consoles/terminals. -->
    <include prefix="xdg">fontconfig/lodpi/luculent.conf</include>

    <!-- Fonts used w/o any fallbacks. Aliased to avoid serif. -->

    <!-- On https://arstechnica.com (the desktop site) when blocking fonts. -->
    <alias binding="same">
        <family>OpenSans</family>
        <prefer>
            <family>Liberation Sans</family>
        </prefer>
    </alias>
    <!-- On https://mashable.com when blocking remote fonts. -->
    <alias binding="same">
        <family>LatoRegular</family>
        <prefer>
            <family>Liberation Sans</family>
        </prefer>
    </alias>
    <!-- On https://gitlab.com and GitLab instances when blocking fonts. -->
    <alias binding="same">
        <family>GitLab Sans</family>
        <prefer>
            <family>Liberation Sans</family>
        </prefer>
    </alias>


</fontconfig>
