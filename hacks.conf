<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- https://www.bbc.com falls back to the sans alias -->
    <alias binding="same">
        <family>BBC Reith Sans</family>
        <accept>
            <family>Noto Sans</family>
        </accept>
    </alias>
    <!-- https://www.bbc.com falls back to the serif alias -->
    <alias binding="same">
        <family>BBC Reith Serif</family>
        <accept>
            <family>Noto Serif</family>
        </accept>
    </alias>

    <!-- https://duckduckgo.com falls back to -apple-system alias -->
    <alias binding="same">
        <family>DuckSansProduct</family>
        <accept>
            <family>Red Hat Text</family>
            <family>Cabin</family>
        </accept>
    </alias>
    
    <!-- https://www.economist.com falls back to the system-ui alias -->
    <alias binding="same">
        <family>EconomistSans</family>
        <accept>
            <family>PT Sans</family>
        </accept>
    </alias>
    <!-- https://www.economist.com falls back to the ui-serif alias -->
    <alias binding="same">
        <family>EconomistSerif</family>
        <accept>
            <family>PT Serif</family>
        </accept>
    </alias>

    <!-- Better than nothing when blocking remote fonts. -->
    <alias binding="same">
        <family>Font Awesome 5 Pro</family>
        <accept>
            <family>Font Awesome 5 Free</family>
        </accept>
    </alias>
    <alias binding="same">
        <family>Font Awesome 6 Pro</family>
        <accept>
            <family>Font Awesome 6 Free</family>
        </accept>
    </alias>
    <alias binding="same">
        <family>Google Material Icons</family>
        <accept>
            <family>Material Icons</family>
        </accept>
    </alias>

    <!-- https://www.theguardian.com falls back to Georgia -->
    <alias binding="same">
        <!-- A semi-condensed bold version would be ideal here -->
        <family>GH Guardian Headline</family>
        <accept>
            <family>Merriweather Black</family>
        </accept>
    </alias>
    <!-- https://www.theguardian.com falls back to Georgia -->
    <alias binding="same">
        <family>Guardian Text Egyptian Web</family>
        <accept>
            <family>Merriweather</family>
        </accept>
    </alias>
    <!-- https://www.theguardian.com falls back to Helvetica -->
    <alias binding="same">
        <family>Guardian Text Sans Web</family>
        <accept>
            <family>Merriweather Sans</family>
        </accept>
    </alias>
    
    <!-- https://finance.yahoo.com falls back to Arial -->
    <alias binding="same">
        <family>GT America</family>
        <accept>
            <family>Public Sans</family>
        </accept>
    </alias>

    <!-- Mastodon instances use Roboto under a custom name. -->
    <alias binding="same">
        <family>mastodon-font-sans-serif</family>
        <accept>
            <family>Roboto</family>
        </accept>
    </alias>

    <!-- https://www.nytimes.com falls back to Helvetica -->
    <alias binding="same">
        <family>nyt-franklin</family>
        <accept>
            <family>Public Sans Medium</family>
        </accept>
    </alias>
    <!-- https://www.nytimes.com falls back to Georgia -->
    <alias binding="same">
        <family>nyt-imperial</family>
        <accept>
            <family>Lingua Franca</family>
        </accept>
    </alias>
    
    <alias binding="same">
        <!-- From https://theintercept.com.-->
        <family>SwiftNeueLTW01</family>
        <accept>
            <family>Lingua Franca</family>
        </accept>
    </alias>
</fontconfig>
