<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>


    <description>Common aliases for all screens</description>


    <!-- Most of the following common typefaces are not perfectly hinted for
         low DPI screens, but they are typically used at bigger sizes. -->


        <!-- Metrically-identical fonts. -->

    <!-- Some of the URW base 35 fonts are included below.
         Only those good enough for low DPI screens because they are either:
             * highly legible even at small sizes (Century Gothic),
             * not typically used at very small sizes (Palatino),
             * or of special type (Dingbats, Symbols). -->

    <!-- Avant Garde, Century Gothic, etc.
         Century Gothic used on: https://www.nationalgeographic.com (fallback),
         https://e.foundation, etc. -->
    <include prefix="xdg">fontconfig/common/urw-gothic.conf</include>

    <!-- Book Antiqua, Palatino, Palatino Lynotype, etc.
         Palatino used on: https://wikipedia.org (fallback),
         https://www.nature.com (fallback), etc. -->
    <include prefix="xdg">fontconfig/common/urw-p052.conf</include>

    <!-- Bebas Neue. Used on https://arstechnica.com. -->
    <include prefix="xdg">fontconfig/common/bebasneue.conf</include>

    <!-- Charter, Bitstream Charter, ITC Charter.
         Used on: https://medium.com, https://www.popularmechanics.com, etc. -->
    <include prefix="xdg">fontconfig/common/charter.conf</include>

    <!-- Comic Sans MS, Chalkboard. The latter is not metrically-identical.
         Comic Sans MS used on: https://youtube.com (Casual subtitles), etc. -->
    <include prefix="xdg">fontconfig/common/comic-relief.conf</include>

    <!-- DejaVu Serif, Bitstream Vera Serif.  -->
    <include prefix="xdg">fontconfig/common/dejavu-serif.conf</include>

    <!-- Dingbats, Zapf Dingbats, etc. -->
    <include prefix="xdg">fontconfig/common/urw-d050000l.conf</include>

    <!-- Oswald.
         Used on:https://www.wired.com, https://scitechdaily.com, etc. -->
    <include prefix="xdg">fontconfig/common/oswald.conf</include>

    <!-- Playfair Display.
         Used on: www.merriam-webster.com, etc. -->

    <!-- PT Sans.
         Used on: https://time.com, https://astronomy.com. -->
    <include prefix="xdg">fontconfig/common/pt-sans.conf</include>

    <!-- PT Serif.
         Used on https://time.com, https://www.science.org. -->
    <include prefix="xdg">fontconfig/common/pt-serif.conf</include>

    <!-- Standard Symbols PS, Standard Symbols L. -->
    <include prefix="xdg">fontconfig/common/urw-standard-symbols-ps.conf</include>

    <!-- Symbol. Symbol Neu. From Google's Croscore 1.23.0 package for ChromeOS.
         Newer versions no longer include it, as web browsers have
         custom glyph mappings for symbols nowadays. -->
    <include prefix="xdg">fontconfig/common/symbol-neu.conf</include>

    <!-- Ubuntu Mono.
         Used on some sites, e.g. https://ubuntu.com. -->
    <include prefix="xdg">fontconfig/common/ubuntu-mono.conf</include>

        <!-- End of metrically-identical fonts -->


        <!-- From here on, matches are not that great,
             but it's better to differentiate these typefaces. -->

        <!-- Fonts perfectly hinted at small sizes. -->

    <!-- Lucida Bright, PT Serif Caption. A bit better than the default serif.
         Used on https://www.spiegel.de (fallback). -->
    <include prefix="xdg">fontconfig/common/pt-serif-caption.conf</include>

    <!-- Trebuchet MS, Cabin. TTF version from googlefontdirectory repo to be
         used on low DPI screens. Latest version only for high DPI screens.
         Trebuchet MS used on: https://lidl.com, https://www.nih.gov (fallback).
         Cabin used on: https://streamable.com. -->
    <include prefix="xdg">fontconfig/common/cabin.conf</include>

        <!-- End of list of fonts perfectly hinted at small sizes. -->


    <!-- Arial Black, Helvetica Black, Nimbus Sans Black.
         Vivus Black is Geist Black with a new name for utilitarian reasons.
         Similar fonts: Nacelle Black, Archivo Black, Public Sans Black. -->
    <include prefix="xdg">fontconfig/common/vivus-black.conf</include>

    <!-- Arial Rounded MT Bold, Helvetica Rounded LT Std Bold. -->
    <include prefix="xdg">fontconfig/common/varela-round.conf</include>

    <!-- Baskerville, Baskerville Old Face, Baskerville PT, Libre Baskerville.
         Used on: https://theconversation.com, https://www.the-scientist.com.-->
    <include prefix="xdg">fontconfig/common/libre-baskerville.conf</include>

    <!-- Brush Script MT. -->
    <include prefix="xdg">fontconfig/common/kaushan-script.conf</include>

    <!-- Cooper Black. -->
    <include prefix="xdg">fontconfig/common/cooper.conf</include>

    <!-- Copperplate, Copperplate Gothic. -->
    <include prefix="xdg">fontconfig/common/cinzel-decorative.conf</include>

    <!-- Impact. Used on: https://www.rottentomatoes.com (fallback). -->
    <include prefix="xdg">fontconfig/common/anton.conf</include>

    <!-- Garamond, Garamond MT, Garamond Premier Pro.
         Used on: https://theatlantic.com, https://harpers.org (fallback). -->
    <include prefix="xdg">fontconfig/common/garamond-libre.conf</include>

    <!-- Gill Sans, Gill Sans MT.
         Used on: https://www.biorxiv.org, https://www.nationalgeographic.com
         (fallback). -->
    <include prefix="xdg">fontconfig/common/gillius-adf-no2.conf</include>

    <!-- Lucida Grande, Lucida Sans, Lucida Sans Unicode, Luxi Sans.
         Lucida Grande used on https://soundcloud.com, https://arxiv.org, etc.
         Lucida Sans Unicode used on https://telegram.org (fallback). -->
    <include prefix="xdg">fontconfig/common/go.conf</include>

    <!-- Luxi Mono. -->
    <include prefix="xdg">fontconfig/common/go-mono.conf</include>

    <!-- Noto Sans Math, Latin Modern Math, STIX Two Math, XITS Math,
         Cambria Math, STIX Math, Asana Math. -->
    <include prefix="xdg">fontconfig/common/noto-sans-math.conf</include>


    <!-- Better than nothing when blocking remote fonts. -->
    <alias binding="same">
        <family>Font Awesome 5 Pro</family>
        <accept>
            <family>Font Awesome 5 Free</family>
        </accept>
    </alias>
    <alias binding="same">
        <family>Font Awesome 6 Pro</family>
        <accept>
            <family>Font Awesome 6 Free</family>
        </accept>
    </alias>


        <!-- Emoji settings and aliases -->

    <!-- Extend emoji aliases, improve font choices for emoji characters
         and, optionally, always substitute a preferred emoji font. -->
    <include prefix="xdg">fontconfig/common/emoji.conf</include>

</fontconfig>
