<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>


    <description>Settings and aliases for high DPI screens</description> 


    <!-- Disable bitmap fonts. -->
    <match target="font">
        <edit name="embeddedbitmap" mode="assign">
            <bool>false</bool>
        </edit>
    </match>

    <!-- Aliases for the generic W3C font families.
         Should be close to the metrics of the main OS'es generics:
           * Times / Helvetica / Courier on macOS,
           * Times New Roman / Arial / Courier New on Windows.
         However, Fontconfig aliases much bigger fonts by default for serif
         and sans-serif, therefore user expectations may be quite different! -->
    <alias binding="strong">
        <family>serif</family>
        <prefer>
            <!-- This is also the default web font when nothing is specified.-->
            <family>Tinos</family>
            <family>PT Astra Serif</family>
            <family>Nimbus Roman</family>
            <family>TeX Gyre Termes</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>sans-serif</family>
        <prefer>
            <!-- Java apps still use this as default UI font, so it should be
                 close metrically to whatever is used for system-ui.
                 A conflicting requirement is this should match Helvetica
                 metrics, as many web developers only test on macOS.
                 Many sites assume tabular numbers for it, e.g. YouTube. -->
            <family>Arimo</family>
            <family>Roboto</family>
            <family>Nimbus Sans</family>
            <family>TeX Gyre Heros</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>monospace</family>
        <prefer>
            <family>Cousine</family>
            <family>Hack</family>
            <family>Cascadia Code PL SemiLight</family>
        </prefer>
    </alias>
    <!-- Chrome picks Cursive and Fantasy aliases by itself. FIXME#5 
         Cursive and Fantasy aliases are ignored by WebKitGTK. FIXME#6 -->
    <alias binding="strong">
        <family>cursive</family>
        <prefer>
            <family>Sedgwick Ave</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>fantasy</family>
        <prefer>
            <family>Grenze Gotisch</family>
        </prefer>
    </alias>

    <!-- Aliases for the CSS 4 font families.
         These are also the recommended typefaces for the user interface texts.
         Sizes to use for interface/document/monospace UI texts: 11/10/10 pt.
         Then adjust appearance by using custom scaling per display, e.g.:
            gsettings set org.gnome.desktop.interface text-scaling-factor "2"
         IF fractional scaling is needed, use fractions best suited to divide
         the pixel numbers of your resolution, e.g. 1.25, 1.5, 1.75, etc.
         For low to medium DPI screens, you might prefer to not use scaling,
         and only increase text sizes in accordance with the zoom level of
         your browser, e.g. 13/12/12 pt for a default browser zoom of 120%.
         For low DPI screens, where no scaling is needed and the default browser
         zoom is at most 120%, switch to the lodpi setup in fonts.conf. -->

    <!-- Most important aliases are "system-ui" and "ui-monospace". Both should
         compare favourably with their counterparts from Windows and macOS.
         They should be no bigger than the biggest one, no smaller than the
         smallest one, and ideally at least as readable. Typefaces used by Linux
         distributions for the interface, but not suitable as system-ui aliases
         (from bad to worse): DejaVu Sans, Noto Sans, Cantarell, Ubuntu. -->

    <!-- Tabular figures are a must for the UI font, not necessarily by default,
         many modern apps use the "tnum" stylistic set when appropriate. -->
    <alias binding="strong">
        <family>system-ui</family>
        <prefer>
            <!-- If setting "DejaVu Sans Condensed", some apps such as Chrome
                 and Firefox pick "DejaVu Sans" as UI font instead if present.
                 A workaround is to use "DejaVu LGC Sans Condensed". -->
            <family>Asap</family>
            <family>Droid Sans</family>
            <family>Roboto</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>ui-monospace</family>
        <prefer>
            <family>Cascadia Code PL SemiLight</family>
            <family>Hack</family>
            <family>Cousine</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>ui-sans-serif</family>
        <prefer>
            <family>Noto Sans</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>ui-serif</family>
        <prefer>
            <family>Noto Serif</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>ui-rounded</family>
        <prefer>
            <family>Varela Round</family>
        </prefer>
    </alias>

    <!-- Aliases used to target the macOS UI font. Hijacked for our UI font.
         Sites assume metrics close to those of the dominant OS'es UI fonts. -->
    <alias binding="strong">
        <family>-apple-system</family>     
        <prefer>
            <family>Asap</family>
            <family>Droid Sans</family>
            <family>Roboto</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>-webkit-system-font</family>
        <prefer>
            <family>Asap</family>
            <family>Droid Sans</family>
            <family>Roboto</family>
        </prefer>
    </alias>
    <alias binding="strong">
        <family>BlinkMacSystemFont</family>
        <prefer>
            <family>Asap</family>
            <family>Droid Sans</family>
            <family>Roboto</family>
        </prefer>
    </alias>
    

        <!-- Metrically-identical fonts. -->

    <!-- Andale Mono, Droid Sans Mono, Noto Mono, Source Code, Source Code Pro.
         Noto Mono used for Bugzilla (fallback code font).
         Source Code Pro used on https://android.googlesource.com. -->
    <include prefix="xdg">fontconfig/hidpi/hasklig.conf</include>

    <!-- Arial, Arial Unicode MS, MS Sans Serif, Arimo.
         Arial and its variants used on many sites, e.g. https://google.com.
         Arimo used on https://www.anandtech.com. -->
    <include prefix="xdg">fontconfig/hidpi/arimo.conf</include>

    <!-- Arial Narrow through Liberation Sans Narrow (available outside the
         Liberation 2.x collection). As set through 30-metric-aliases.conf.
         Used on: https://www.msnbc.com (fallback),
         https://www.economist.com (fallback). -->

    <!-- Bitstream Vera Sans, DejaVu Sans. Also used for Verdana alias. -->
    <include prefix="xdg">fontconfig/hidpi/dejavu-sans.conf</include>

    <!-- Bitstream Vera Sans Mono, DejaVu Sans Mono, Menlo, SFMono-Regular.
         DejaVu Sans Mono used on many sites, e.g. https://gitlab.com.
         SFMono-Regular used on https://github.com.
         Menlo is default code font for Bugzilla. -->
    <include prefix="xdg">fontconfig/hidpi/hack.conf</include>

    <!-- Bitter Pro, Bitter. Used on: https://arstechnica.com. -->
    <include prefix="xdg">fontconfig/hidpi/bitter-pro.conf</include>

    <!-- Barlow. Used on some sites, e.g. https://liliputing.com. -->

    <!-- Bookman Old Style. -->
    <include prefix="xdg">fontconfig/hidpi/urw-bookman.conf</include>

    <!-- Cascadia Code PL. Only the Semilight/SemiBold font files. -->
    <include prefix="xdg">fontconfig/hidpi/cascadia-code-pl.conf</include>

    <!-- Century Schoolbook. -->
    <include prefix="xdg">fontconfig/hidpi/urw-c059.conf</include>

    <!-- Consolas. Closer to the original than Inconsolata. -->
    <include prefix="xdg">fontconfig/hidpi/dmca-sans-serif.conf</include>

    <!-- Courier. Closer to the original than Cousine / Liberation Mono. -->
    <include prefix="xdg">fontconfig/hidpi/courier-prime.conf</include>

    <!-- Courier New. -->
    <include prefix="xdg">fontconfig/hidpi/urw-nimbus-mono-ps.conf</include>

    <!-- Droid Sans. Also covers Chinese, Japanese, Thai, etc. -->

    <!-- Fira Sans, FiraGO.
         Fira Mono. -->
    <include prefix="xdg">fontconfig/hidpi/fira.conf</include>

    <!-- Georgia, Georgia Pro. -->
    <include prefix="xdg">fontconfig/hidpi/gelasio.conf</include>

    <!-- JetBrains Mono, GitLab Mono.
         GitLab Mono used on https://gitlab.com and other GitLab instances. -->
    <include prefix="xdg">fontconfig/hidpi/jetbrains-mono.conf</include>

    <!-- Helvetica, FreeSans. Not Helvetica Neue (different metrics!). -->
    <include prefix="xdg">fontconfig/hidpi/urw-nimbus-sans.conf</include>

    <!-- Helvetica Condensed/Narrow etc. -->
    <include prefix="xdg">fontconfig/hidpi/urw-nimbus-sans-narrow.conf</include>

    <!-- Inconsolata. Inspired by Consolas, but pretty popular on its own. -->

    <!-- Inter, Inter UI, SF Pro Text, GitLab Sans.
         Inter Display, SF Pro, SF Pro Display.
         Inter used on https://www.euronews.com, https://riot.im/app, etc.
         GitLab Sans used on https://gitlab.org and other GitLab instances.
         SF Pro Text used on many sites, e.g. https://apple.com.
         SF Pro used on many sites, e.g. https://apps.apple.com. -->
    <include prefix="xdg">fontconfig/hidpi/inter.conf</include>

    <!-- Lato.
         Used on: https://sourceforge.net, https://app.slack.com, etc. -->
    <include prefix="xdg">fontconfig/hidpi/lato.conf</include>

    <!-- Liberation Serif. -->
    <include prefix="xdg">fontconfig/hidpi/tinos.conf</include>

    <!-- Linux Libertine, Libertinus Serif. Used on https://wikipedia.org. -->
    <include prefix="xdg">fontconfig/hidpi/common-serif.conf</include>

    <!-- Lobster. Used and abused on many sites. -->
    <include prefix="xdg">fontconfig/hidpi/lobstertwo.conf</include>

    <!-- Lora. Used on https://www.vice.com. -->

    <!-- Lucida Console, Lucida Console/Sans Typewriter/Grande Mono. -->
    <include prefix="xdg">fontconfig/hidpi/cousine.conf</include>

    <!-- Merriweather.
         Used on: https://www.forbes.com, https://www.goodreads.com, etc. -->
    <include prefix="xdg">fontconfig/hidpi/merriweather.conf</include>

    <!-- Merriweather Sans. Used on: https://plausible.io. -->
    <include prefix="xdg">fontconfig/hidpi/merriweather-sans.conf</include>

    <!-- Monserrat. Popular according to Google Fonts. -->

    <!-- Monotype Corsiva, Corsiva, Lucida Calligraphy. -->
    <include prefix="xdg">fontconfig/hidpi/monacal.conf</include>

    <!-- Nimbus Roman, Roman, TeX Gyre Termes. -->
    <include prefix="xdg">fontconfig/hidpi/urw-nimbus-roman.conf</include>

    <!-- Noto Sans Mono -->
    <include prefix="xdg">fontconfig/hidpi/noto-sans-mono.conf</include>

    <!-- Noto Sans. Used on many sites, e.g. https://reddit.com -->
    <include prefix="xdg">fontconfig/hidpi/noto-sans.conf</include>

    <!-- Noto Serif. Droid Serif. -->
    <include prefix="xdg">fontconfig/hidpi/noto-serif.conf</include>

    <!-- Nunito, Nunito Sans. Popular according to Google Fonts. -->
    <include prefix="xdg">fontconfig/hidpi/nunito-sans.conf</include>

    <!-- Open Sans. Used on many sites, e.g. https://arstechnica.com.
         Also, Mattermost's web client interface font. -->
    <include prefix="xdg">fontconfig/hidpi/open-sans.conf</include>

    <!-- Poppins. Popular according to Google Fonts. -->

    <!-- Raleway. Popular according to Google Fonts. -->

    <!-- Roboto. Used on many sites, e.g. Mastodon instances -->
    <include prefix="xdg">fontconfig/hidpi/roboto.conf</include>

    <!-- Roboto Condensed. Popular according to Google Fonts. -->

    <!-- Roboto Mono. Popular according to Google Fonts. -->

    <!-- Roboto Slab. Popular according to Google Fonts. -->

    <!-- Rubik. Popular according to Google Fonts. -->

    <!-- Source Sans Pro.
         Used on: https://streamable.com/, https://www.archives.gov/. -->
    <include prefix="xdg">fontconfig/hidpi/source-sans-3.conf</include>

    <!-- Source Serif Pro. Used on https://medium.com. -->
    <include prefix="xdg">fontconfig/hidpi/source-serif-4.conf</include>

    <!-- Times New Roman, MS Serif.
         Times New Roman used in many documents and online at
         https://www.nlm.nih.gov/, https://www.latimes.com (fallback). -->
    <include prefix="xdg">fontconfig/hidpi/pt-astra-serif.conf</include>

    <!-- Segoe UI, Segoe.
         Segoe UI used on https://www.microsoft.com, https://msn.com, etc.
         Segoe used on https://outlook.live.com. -->
    <include prefix="xdg">fontconfig/hidpi/selawik.conf</include>

    <!-- Tahoma.
         Still used on some sites. -->
    <include prefix="xdg">fontconfig/hidpi/tagoni.conf</include>

    <!-- Verdana.
         Used on: https://www.imdb.com, https://news.ycombinator.com. -->
    <include prefix="xdg">fontconfig/hidpi/veranda.conf</include>

    <!-- Zapf Chancery. -->
    <include prefix="xdg">fontconfig/hidpi/urw-z003.conf</include>

    <!-- Zilla Slab. -->
    <include prefix="xdg">fontconfig/hidpi/zilla-slab.conf</include>

    <!-- End of metrically-identical fonts -->


        <!-- From here on, matches are not metrically-identical, 
             but it's better to differentiate these typefaces. -->

    <!-- American Typewriter. -->
    <include prefix="xdg">fontconfig/hidpi/cmu_typewriter_text_variable_width.conf</include>

    <!-- Bodoni. -->
    <include prefix="xdg">fontconfig/hidpi/libre-bodoni.conf</include>

    <!-- Candara. -->
    <include prefix="xdg">fontconfig/hidpi/rosario.conf</include>

    <!-- Constantia.
         Guardian Text Egyptian.
         NYT Imperial.
         Utopia, Heuristica, etc. -->
    <include prefix="xdg">fontconfig/hidpi/lingua-franca.conf</include>

    <!-- Corbel. -->
    <include prefix="xdg">fontconfig/hidpi/cantorbell.conf</include>

    <!-- Franklin, Franklin Gothic, etc. Slightly bigger, less condensed.
         Franklin used on https://www.washingtonpost.com.
         Franklin Gothic used on https://www.rottentomatoes.com and
         https://www.nationalgeographic.com (fallback).. -->
    <include prefix="xdg">fontconfig/hidpi/public-sans.conf</include>

    <!-- Futura, Futura BT, Futura Now, Futura, PT, Neufville Futura. -->
    <include prefix="xdg">fontconfig/hidpi/jost.conf</include>

    <!-- ITC Garamond, Adobe Garamond, Garamond Premier Pro, EB Garamond.
         Adobe Garamond Pro used on https://www.theatlantic.com.
         Eb Garamond used on https://www.msn.com. -->
    <include prefix="xdg">fontconfig/hidpi/eb-garamond.conf</include>      

    <!-- Goudy Old Style, Goudy Oldstyle.
         Used on: https://harpers.org -->
    <include prefix="xdg">fontconfig/hidpi/miju-goudy.conf</include>

    <!-- Google Sans. Google's trademark typeface derived from Product Sans.
         Similar enough alternative to be useful when blocking remote fonts. -->
    <include prefix="xdg">fontconfig/hidpi/deepmind-sans.conf</include>

    <!-- Monaco. Similar, but smaller than what it should be.
         Used on https://docs.oracle.com, https://docs.aws.amazon.com. -->
    <include prefix="xdg">fontconfig/hidpi/code-new-roman.conf</include>

    <!-- Proxima Nova.
         Used on many sites, e.g. DuckDuckGo, https://www.cnbc.com, etc. -->
    <include prefix="xdg">fontconfig/hidpi/red-hat-text.conf</include>


        <!-- Rules for extra fonts. -->

    <!-- Spline Sans. -->
    <include prefix="xdg">fontconfig/hidpi/spline-sans.conf</include>

    <!-- Spline Sans Mono. -->
    <include prefix="xdg">fontconfig/hidpi/spline-sans-mono.conf</include>


</fontconfig>
