<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Generic name aliasing -->
    <alias>
        <family>sans-serif</family>
        <accept>
            <family>Cabin</family>
        </accept>
    </alias>

    <!-- Generic name assignment -->
    <alias>
        <family>Cabin</family>
        <default>
            <family>sans-serif</family>
        </default>
    </alias>

    <!-- Font substitution rules -->
    <alias binding="same">
        <family>Trebuchet MS</family>
        <prefer>
            <family>Cabin</family>
        </prefer>
    </alias>

    <!-- For https://www.imdb.com when blocking remote fonts. -->
    <alias binding="same">
        <family>Trebuchet</family>
        <prefer>
            <family>Cabin</family>
        </prefer>
    </alias>
</fontconfig>
