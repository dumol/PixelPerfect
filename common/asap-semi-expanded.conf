<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Font substitution rules -->
    <alias binding="same">
        <family>Arial Rounded MT Bold</family>
        <prefer>
            <family>Asap Semi Expanded</family>
        </prefer>
    </alias>

    <alias binding="same">
        <family>Helvetica Rounded LT Std Bold</family>
        <prefer>
            <family>Asap Semi Expanded</family>
        </prefer>
    </alias>
</fontconfig>
