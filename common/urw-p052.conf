<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Generic name aliasing -->
    <alias>
        <family>serif</family>
        <accept>
            <family>P052</family>
        </accept>
    </alias>

    <!-- Generic name assignment -->
    <alias>
        <family>P052</family>
        <default>
            <family>serif</family>
        </default>
    </alias>

    <!-- Original PostScript base font mappings -->
    <alias binding="same">
        <family>P052</family>
        <default>
            <family>Palatino</family>
        </default>
    </alias>

    <alias binding="same">
        <family>Palladio URW</family>
        <default>
            <family>Palatino</family>
        </default>
    </alias>

    <alias binding="same">
        <family>URW Palladio L</family>
        <default>
            <family>Palatino</family>
        </default>
    </alias>

    <!-- Font substitution rules -->
    <alias binding="same">
        <family>Book Antiqua</family>
        <prefer>
            <family>P052</family>
            <family>Tex Gyre Pagella</family>
        </prefer>
    </alias>

    <alias binding="same">
        <family>Palatino</family>
        <prefer>
            <family>P052</family>
            <family>Tex Gyre Pagella</family>
        </prefer>
    </alias>

    <alias binding="same">
        <family>Palatino Linotype</family>
        <prefer>
            <family>P052</family>
            <family>Tex Gyre Pagella</family>
        </prefer>
    </alias>

    <alias binding="same">
        <family>Palladio URW</family>
        <prefer>
            <family>P052</family>
            <family>Tex Gyre Pagella</family>
        </prefer>
    </alias>

    <alias binding="same">
        <family>URW Palladio L</family>
        <prefer>
            <family>P052</family>
            <family>Tex Gyre Pagella</family>
        </prefer>
    </alias>
</fontconfig>
