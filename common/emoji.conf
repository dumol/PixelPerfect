<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Generic name aliasing -->
    <alias>
        <family>emoji</family>
        <accept>
            <family>Twemoji</family>
        </accept>
    </alias>
    <alias>
        <family>emoji</family>
        <accept>
            <family>OpenMoji Color</family>
        </accept>
    </alias>
    <alias>
        <family>emoji</family>
        <accept>
            <family>OpenMoji Black</family>
        </accept>
    </alias>

    <!-- Generic name assignment -->
    <alias binding="same">
        <family>Twemoji</family>
        <default>
            <family>emoji</family>
        </default>
    </alias>
    <alias binding="same">
        <family>OpenMoji Color</family>
        <default>
            <family>emoji</family>
        </default>
    </alias>
    <alias binding="same">
        <family>OpenMoji Black</family>
        <default>
            <family>emoji</family>
        </default>
    </alias>

    <!-- Fontconfig rules, updated and extended -->
    <alias binding="strong">
        <family>emoji</family>
        <prefer>
            <!-- Color fonts -->
            <family>Noto Color Emoji</family> <!-- Google -->
            <family>Apple Color Emoji</family> <!-- Apple -->
            <family>Fluent Emoji</family> <!-- Microsoft -->
            <family>Twemoji</family> <!-- Twitter's font fork -->
            <family>Fluent Emoji Flat</family> <!-- Version with no gradients-->
            <family>OpenMoji Color</family> <!-- OpenMoji project -->
            <!-- Non-color fonts -->
            <family>Noto Emoji</family> <!-- Google -->
            <family>OpenMoji Black</family> <!-- Experimental B&W version -->
        </prefer>
    </alias>

    <!-- To override any font with 'emoji' in its name, prepend your choice.
    <match>
        <test name="family" compare="contains">
            <string>emoji</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Twemoji</string>
        </edit>
    </match>
    -->

    <!-- If other fonts contain emoji glyphs, they could interfere and
         make some emojis rendered in undesired font (often in black-and-white).
         For example, DejaVu Sans contains black-and-white emojis, which can be
         removed using the following "minus/charset" trick.
         Check what fonts are used for a specific character with something like:
            fc-list :charset=263a
         Firefox/Chrome and derivatives don't obey these rules though. FIXME -->
    <match target="scan">
        <test name="family" compare="not_contains">
            <string>moji</string>
        </test>
        <edit name="charset" mode="assign" binding="same">
            <minus>
                <name>charset</name>
                <charset>
                    <!-- 2600..26ff; Miscellaneous Symbols -->
                    <range>
                        <int>0x2600</int>
                        <int>0x2604</int>
                    </range>
                    <int>0x260e</int>
                    <int>0x2611</int>
                    <int>0x2614</int>
                    <int>0x2618</int>
                    <int>0x261d</int>
                    <int>0x2620</int>
                    <int>0x2622</int>
                    <int>0x2623</int>
                    <int>0x2626</int>
                    <int>0x262a</int>
                    <int>0x262e</int>
                    <int>0x262f</int>
                    <int>0x2638</int>
                    <int>0x2639</int>
                    <int>0x263a</int>
                    <int>0x2640</int>
                    <int>0x2642</int>
                    <range>
                        <int>0x2648</int>
                        <int>0x2653</int>
                    </range>
                    <int>0x265f</int>
                    <int>0x2660</int>
                    <int>0x2663</int>
                    <int>0x2665</int>
                    <int>0x2666</int>
                    <int>0x2668</int>
                    <int>0x267b</int>
                    <int>0x267e</int>
                    <int>0x267f</int>
                    <range>
                        <int>0x2692</int>
                        <int>0x2697</int>
                    </range>
                    <int>0x2699</int>
                    <int>0x269b</int>
                    <int>0x269c</int>
                    <int>0x26a0</int>
                    <int>0x26a1</int>
                    <int>0x26a7</int>
                    <int>0x26aa</int>
                    <int>0x26ab</int>
                    <int>0x26b0</int>
                    <int>0x26b1</int>

                    <!-- 2700..27bf; Dingbats -->
                    <int>0x2702</int>
                    <int>0x2708</int>
                    <int>0x2709</int>
                    <int>0x270c</int>
                    <int>0x270d</int>
                    <int>0x270f</int>
                    <int>0x2712</int>
                    <int>0x2714</int>
                    <int>0x2716</int>
                    <int>0x271d</int>
                    <int>0x2721</int>
                    <int>0x2733</int>
                    <int>0x2734</int>
                    <int>0x2744</int>
                    <int>0x2747</int>
                    <int>0x2763</int>
                    <int>0x2764</int>
                    <int>0x27a1</int>

                   <!-- 1f300..1f5ff; Miscellaneous Symbols and Pictographs -->
                    <range>
                        <int>0x1f311</int>
                        <int>0x1f318</int>
                    </range>
                    <int>0x1f374</int>
                    <int>0x1f42d</int>
                    <int>0x1f42e</int>
                    <int>0x1f431</int>
                    <int>0x1f435</int>

                    <!-- 1f600..1f64f; Emoticons -->
                    <range>
                        <int>0x1f600</int>
                        <int>0x1f643</int>
                    </range>
                </charset>
            </minus>
        </edit>
    </match>

    <!-- Alternative from https://github.com/googlefonts/noto-emoji/issues/36,
    but doesn't seem to be working any more. FIXME
    <match>
        <test name="family">
            <string>sans-serif</string>
        </test>
        <test name="prgname" compare="not_contains">
            <string>Ripcord</string>
        </test>
        <edit name="family" mode="prepend" binding="weak">
            <string>Twemoji</string>
        </edit>
    </match>
    -->

</fontconfig>
